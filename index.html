<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danske skoler – kort</title>
    <meta name="description" content="Kort over danske skoler med filtre på institutionstype og kommune." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%232e7d32' d='M12 2c-3.9 0-7 3.1-7 7 0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" integrity="sha384-VzLXTJGPSyTLX6d96AxgkKvE/LRb7ECGyTxuwtpjHnVWVZs2gp5RDjeM/tgBnVdM" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" integrity="sha384-lPzjPsFQL6te2x+VxmV6q1DpRxpRk0tmnl2cpwAO5y04ESyc752tnEWPKDfl1olr" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" integrity="sha384-5kMSQJ6S4Qj5i09mtMNrWpSi8iXw230pKU76xTmrpezGnNJQzj0NzXjQLLg+jE7k" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" integrity="sha384-OXVF05DQEe311p6ohU11NwlnX08FzMCsyoXzGOaL+83dKAb3qS17yZJxESl8YrJQ" crossorigin="anonymous" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        :root {
            --ink: #12212b;
            --muted: #55636f;
            --line: #cfd6dd;
            --accent: #2e7d32;
            --accent-hover: #276b2b;
            --focus: #17553a;
            --chip-bg: #e8f0f8;
            --chip-line: #a9c1d8;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: var(--ink);
        }

        #map {
            position: absolute;
            inset: 0;
            z-index: 0;
            height: 100%;
            width: 100%;
        }

        /* browser surfaces themed from the palette */
        ::selection {
            color: var(--ink);
            background: #cfe3d4;
        }

        :focus-visible {
            outline: 3px solid var(--focus);
            outline-offset: 2px;
        }

        [hidden] {
            display: none !important;
        }

        #schoolSearch,
        .select2-search__field {
            caret-color: var(--accent);
        }

        #filterPanel {
            scrollbar-width: thin;
            scrollbar-color: #b3bfca #fff;
        }

        #filterPanel::-webkit-scrollbar {
            width: 10px;
        }

        #filterPanel::-webkit-scrollbar-thumb {
            background: #b3bfca;
            border: 2px solid #fff;
            border-radius: 6px;
        }

        /* ---- top bar ---- */
        #topBar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            padding: 10px 12px;
            pointer-events: none;
        }

        #topBar > * {
            pointer-events: auto;
        }

        #title {
            margin: 0;
            padding: 9px 13px;
            font-size: 16px;
            font-weight: 650;
            letter-spacing: -0.01em;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid var(--line);
            border-radius: 6px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
        }

        #filterButton {
            min-height: 38px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            color: var(--ink);
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
        }

        #filterButton:hover {
            background: #f2f5f8;
        }

        #filterButton[aria-expanded="true"] {
            background: #e6edf4;
            border-color: #9fb2c6;
        }

        /* select2 appends its dropdown to <body>; keep it above the panel */
        .select2-container {
            z-index: 1150;
        }

        /* ---- filter panel ---- */
        #filterPanel {
            position: absolute;
            top: 60px;
            right: 12px;
            z-index: 1100;
            width: 320px;
            max-width: calc(100vw - 24px);
            padding: 16px;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
        }

        .panelHeader {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin: 0 0 16px;
        }

        .panelTitle {
            margin: 0;
            font-size: 15px;
            font-weight: 650;
            letter-spacing: -0.01em;
        }

        .panelClose {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            margin: -6px -6px -6px 0;
            padding: 0;
            font-size: 20px;
            line-height: 1;
            color: #3c4d5a;
            background: none;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .panelClose:hover {
            color: var(--ink);
            background: #eef2f6;
        }

        .panelGroup {
            margin-bottom: 16px;
        }

        .panelHeading {
            margin: 0 0 6px;
            font-size: 13px;
            font-weight: 650;
        }

        /* keep select2 from stretching the whole page when its dropdown opens */
        #filterPanel .select2-container {
            width: 100% !important;
        }

        /* select2 ships its own chrome; align it with the panel */
        .select2-container--default .select2-selection--multiple {
            min-height: 40px;
            padding: 3px 4px;
            background: #fff;
            border: 1px solid #aab4bf;
            border-radius: 4px;
        }

        .select2-container--default.select2-container--focus .select2-selection--multiple,
        .select2-container--default.select2-container--open .select2-selection--multiple {
            border-color: var(--focus);
            box-shadow: 0 0 0 1px var(--focus);
        }

        .select2-container--default .select2-selection--multiple .select2-selection__choice {
            display: inline-flex;
            align-items: center;
            min-height: 28px;
            margin: 2px;
            padding: 2px 8px;
            font-size: 12.5px;
            color: var(--ink);
            background: var(--chip-bg);
            border: 1px solid var(--chip-line);
            border-radius: 999px;
        }

        .select2-container--default .select2-selection--multiple .select2-selection__choice__remove {
            position: static;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            margin-right: 4px;
            padding: 0;
            font-size: 14px;
            line-height: 1;
            color: #4a6274;
            border: none;
            background: transparent;
            cursor: pointer;
        }

        .select2-container--default .select2-selection--multiple .select2-selection__choice__remove:hover {
            color: #b3261e;
        }

        #filterPanel .select2-search__field::placeholder {
            color: #5d6b76;
            opacity: 1;
        }

        .select2-container--default .select2-selection--multiple .select2-selection__clear {
            color: #4a6274;
        }


        .select2-container--default .select2-selection--multiple .select2-selection__placeholder {
            color: #5d6b76;
        }

        .select2-container--default .select2-search--inline .select2-search__field {
            font-family: inherit;
            font-size: 14px;
        }

        .select2-dropdown {
            font-family: inherit;
            border: 1px solid var(--line);
            border-radius: 6px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.16);
        }

        .select2-container--default .select2-results__option--highlighted[aria-selected] {
            background: var(--accent);
        }

        #schoolSearch::placeholder {
            color: #5d6b76;
            opacity: 1;
        }

        #schoolSearch {
            width: 100%;
            min-height: 40px;
            padding: 8px 10px;
            font-size: 14px;
            font-family: inherit;
            color: var(--ink);
            background: #fff;
            border: 1px solid #aab4bf;
            border-radius: 4px;
        }

        #applyFilters {
            width: 100%;
            min-height: 40px;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            background: var(--accent);
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #applyFilters:hover {
            background: var(--accent-hover);
        }

        #applyBar {
            margin-top: 2px;
        }

        .legend {
            margin: 14px 0 0;
            padding-top: 12px;
            border-top: 1px solid #e6ebef;
            font-size: 12.5px;
            line-height: 1.5;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }

        .legendKey {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px 12px;
            margin: 0 0 6px;
            color: var(--ink);
        }

        .legendKey span {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* swatches mirror the cluster sizes so the key shows the encoding itself */
        .swatch {
            display: inline-block;
            box-sizing: border-box;
            border: 2px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.18);
        }

        /* ---- bottom bar ---- */
        #bottomBar {
            position: absolute;
            left: 10px;
            right: 10px;
            bottom: 10px;
            z-index: 1000;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 10px;
            pointer-events: none;
        }

        #bottomBar > * {
            pointer-events: auto;
        }

        #statusBox {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
            min-width: 0;
            max-width: calc(100% - 96px);
        }

        #schoolCount {
            max-width: 100%;
            font-variant-numeric: tabular-nums;
            margin: 0;
            padding: 6px 10px;
            font-size: 13px;
            font-weight: 600;
            line-height: 1.35;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid var(--line);
            border-radius: 6px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
        }

        #errorBox {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            font-size: 12.5px;
            line-height: 1.4;
            color: #8c1d18;
            background: #fff;
            border: 1px solid #e0b4b0;
            border-radius: 6px;
        }

        #retryButton {
            min-height: 28px;
            padding: 2px 10px;
            font-size: 12.5px;
            font-family: inherit;
            color: var(--ink);
            background: #fff;
            border: 1px solid #cbb3b1;
            border-radius: 4px;
            cursor: pointer;
        }

        #retryButton:hover {
            background: #fdf3f2;
        }

        #filterRow {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            min-width: 0;
            max-width: 100%;
        }

        #activeFilters {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            min-width: 0;
            max-width: 100%;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            max-width: 100%;
            min-height: 30px;
            padding: 4px 10px;
            font-size: 12.5px;
            color: var(--ink);
            background: var(--chip-bg);
            border: 1px solid var(--chip-line);
            border-radius: 999px;
            cursor: pointer;
        }

        .chip-label {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .chip:hover {
            background: #d9e7f4;
        }

        .chip-x {
            font-size: 14px;
            line-height: 1;
            color: #4a6274;
        }

        .chip:hover .chip-x {
            color: #b3261e;
        }

        #showAll {
            min-height: 30px;
            padding: 4px 12px;
            font-size: 12.5px;
            color: var(--ink);
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 6px;
            cursor: pointer;
        }

        #showAll:hover {
            background: #f2f5f8;
        }

        #githubLink {
            padding: 6px 10px;
            font-size: 12.5px;
            color: var(--ink);
            text-decoration: none;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 6px;
        }

        #githubLink:hover {
            background: #f2f5f8;
        }

        /* ---- popup + modal ---- */
        .school-popup h3 {
            margin: 0 0 6px;
            font-size: 15px;
            line-height: 1.3;
        }

        .school-popup p {
            margin: 2px 0;
            font-size: 13px;
        }

        .details-btn {
            margin-top: 8px;
            min-height: 32px;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            background: var(--accent);
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .details-btn:hover {
            background: var(--accent-hover);
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1200;
            overflow: auto;
            background: rgba(10, 20, 30, 0.45);
        }

        .modal-content {
            position: relative;
            margin: 12vh auto 0;
            padding: 22px 24px 26px;
            width: calc(100% - 28px);
            max-width: 560px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
        }

        .close {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 40px;
            height: 40px;
            font-size: 24px;
            line-height: 1;
            color: #2b3a45;
            background: none;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .close:hover {
            background: #eef2f6;
        }

        #modalTitle {
            margin: 0 40px 12px 0;
            font-size: 20px;
            line-height: 1.3;
            text-wrap: balance;
        }

        #modalContent a {
            text-underline-offset: 3px;
        }

        #modalContent p {
            margin: 8px 0;
            font-size: 14px;
            line-height: 1.5;
        }

        #modalContent strong {
            font-weight: 650;
            color: #2b3a45;
        }

        /* keep the zoom control clear of the title chip */
        #map .leaflet-top.leaflet-left .leaflet-control-zoom {
            margin-top: 52px;
        }

        .leaflet-control-attribution {
            font-size: 12px;
        }

        .cluster {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            border: 2px solid #fff;
            border-radius: 50%;
            color: #fff;
            font-size: 13px;
            font-weight: 650;
            font-variant-numeric: tabular-nums;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.28);
        }

        .school-marker {
            filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.35));
        }

        #loading {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1300;
            padding: 14px 18px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid var(--line);
            border-radius: 8px;
        }

        @media (max-width: 600px) {
            #topBar {
                padding: 8px 10px;
            }

            #title {
                font-size: 14px;
                padding: 7px 10px;
                min-height: 44px;
                display: inline-flex;
                align-items: center;
            }

            #filterButton {
                min-height: 44px;
                padding: 10px 16px;
            }

            /* touch users pinch; the control would sit under the title chip */
            #map .leaflet-control-zoom {
                display: none;
            }

            /* full-width sheet instead of a clipped popover */
            #filterPanel {
                top: 54px;
                left: 0;
                right: 0;
                width: auto;
                max-width: none;
                max-height: 78%;
                overflow-y: auto;
                border-radius: 0 0 10px 10px;
                padding: 14px 14px 18px;
            }

            #applyBar {
                position: sticky;
                bottom: 0;
                margin-top: 4px;
                padding-top: 10px;
                background: #fff;
            }

            #applyFilters {
                min-height: 46px;
            }

            .panelClose {
                width: 44px;
                height: 44px;
                margin: -10px -8px -10px 0;
            }

            .chip,
            #showAll,
            #githubLink,
            #retryButton {
                min-height: 44px;
            }

            .select2-container--default .select2-selection--multiple .select2-selection__choice {
                min-height: 34px;
                padding: 4px 10px;
            }

            #githubLink {
                display: inline-flex;
                align-items: center;
            }

            #statusBox {
                max-width: calc(100% - 92px);
            }

            #schoolCount {
                font-size: 12.5px;
            }

            .close {
                width: 44px;
                height: 44px;
            }

            .details-btn {
                min-height: 44px;
            }

            .modal-content {
                margin-top: 0;
                width: 100%;
                border-radius: 0 0 12px 12px;
                padding: 18px 16px 22px;
            }
        }
    </style>
</head>

<body>
    <header id="topBar">
        <h1 id="title">Danske skoler</h1>
        <button id="filterButton" aria-expanded="false" aria-controls="filterPanel">Filtre</button>
    </header>

    <section id="filterPanel" hidden>
        <div class="panelHeader">
            <h2 class="panelTitle">Filtre</h2>
            <button id="closePanel" class="panelClose" type="button" aria-label="Luk filtre">&times;</button>
        </div>
        <div class="panelGroup">
            <h2 class="panelHeading">Institutionstype</h2>
            <select id="instTypeFilters" multiple></select>
        </div>
        <div class="panelGroup">
            <h2 class="panelHeading">Kommune</h2>
            <select id="kommuneFilters" multiple></select>
        </div>
        <div class="panelGroup">
            <label class="panelHeading" for="schoolSearch">Søg på skole</label>
            <input id="schoolSearch" type="search" placeholder="F.eks. Engskolen" />
        </div>
        <div id="applyBar">
            <button id="applyFilters">Anvend filtre</button>
        </div>
        <div class="legend">
            <div class="legendKey">
                <span><span class="swatch" style="width: 12px; height: 12px; background: #2e7d32"></span>1–9</span>
                <span><span class="swatch" style="width: 16px; height: 16px; background: #1e5b28"></span>10–99</span>
                <span><span class="swatch" style="width: 20px; height: 20px; background: #123f1c"></span>100+</span>
            </div>
            Tallet i en klynge er antal skoler på stedet. Tal i parentes er skoler af den type.
        </div>
    </section>

    <div id="schoolDetailsModal" class="modal">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <button type="button" class="close" aria-label="Luk">&times;</button>
            <h2 id="modalTitle"></h2>
            <div id="modalContent"></div>
        </div>
    </div>

    <div id="bottomBar">
        <div id="statusBox">
            <p id="schoolCount" aria-live="polite">Indlæser skoler …</p>
            <div id="errorBox" role="alert" hidden>
                <span id="errorMessage"></span>
                <button id="retryButton" type="button">Prøv igen</button>
            </div>
            <div id="filterRow">
                <div id="activeFilters"></div>
                <button id="showAll" hidden>Vis alle skoler</button>
            </div>
        </div>
        <a id="githubLink" href="https://github.com/dkpoulsen/schools-overview" target="_blank" rel="noopener noreferrer">GitHub</a>
    </div>

    <div id="map"></div>

    <p id="loading" role="status">Indlæser skoledata …</p>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js" integrity="sha384-RFZC58YeKApoNsIbBxf4z6JJXmh+geBSgkCQXFyh+4tiFSJmJBt+2FbjxW7Ar16M" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js" integrity="sha384-RLIyj5q1b5XJTn0tqUhucRZe40nFTocRP91R/NkRJHwAe4XxnTV77FXy/vGLiec2" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha384-vtXRMe3mGCbOeY7l30aIg8H9p3GdeSe4IFlP6G8JMa7o7lXvnz3GFKzPxzJdPfGK" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js" integrity="sha384-d3UHjPdzJkZuk5H3qKYMLRyWLAQBJbby2yr2Q58hXXtAGF8RSNO9jpLDlKKPv5v3" crossorigin="anonymous"></script>
    <script src="static/js/map.js"></script>
</body>

</html>
